# Secret scanning rules for gitleaks (used by .github/workflows/secret-scan.yml).
# Starts from the built-in gitleaks rules and adds formats they don't cover.
title = "syllo secret scanning"

[extend]
useDefault = true

# Comfy platform API keys (platform.comfy.org/profile/api-keys): "comfyui-" plus 64 hex chars.
# The built-in rules do not recognise this format.
[[rules]]
id = "comfy-api-key"
description = "Comfy platform API key"
regex = '''\bcomfyui-[0-9a-f]{64}\b'''
keywords = ["comfyui-"]

[[allowlists]]
description = "Vendored agent skill docs; their examples use sample tokens"
paths = ['''^\.agents/''']

# The generic-api-key rule reads a localStorage key name (syllo_appearance_v1) as a secret. Only names of this exact
# shape are allowed, and only for that rule.
[[allowlists]]
description = "Browser storage key names, such as STORAGE_KEY = \"syllo_appearance_v1\""
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''STORAGE_KEY\s*=\s*"syllo[_:][a-z0-9_:.-]+"''']
